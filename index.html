<!DOCTYPE html>
<html lang='en'>

<head>
    <!-- VS code auto-filled some of these next 3 lines stuff when I make the html tag.-->
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Dickert, Benjamin - PA1 Task Form</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <h1>Task Manager</h1>
</head>

<Body>
    <form id="task-form">
        <label>Task Name</label>
        <input id="task-name" type="text" placeholder="Enter Here">

        <label>Priority</label>
        <select id="priority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select>

        <button>Add Task</button>
    </form>

    <div id="task-list">
        Tasks will appear here.
    </div>
</Body>

</html>
